<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picpool - Admin</title>
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="logo.png">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/cc720c3bd4.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-1: #0e0c18;
            --bg-2: #15111f;
            --bg-3: #0c0e19;
            --ink: #f1edfa;
            --muted: #a29bc4;
            --glass: rgba(255,255,255,0.055);
            --glass-strong: rgba(255,255,255,0.09);
            --glass-border: rgba(255,255,255,0.12);
            --accent-1: #a78bfa;
            --accent-2: #fda4c0;
            --blush: #ff9ecb;
            --lilac: #b39dff;
            --mint: #7fe9c4;
            --success: #34d399;
            --error: #fb7185;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
            color: var(--ink);
            position: relative;
            overflow-x: hidden;
        }
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.28;
            z-index: 0;
            pointer-events: none;
        }
        .blob.b1 { width: 440px; height: 440px; background: var(--blush); top: -140px; left: -110px; animation: drift1 20s ease-in-out infinite; }
        .blob.b2 { width: 400px; height: 400px; background: var(--lilac); bottom: -150px; right: -100px; animation: drift2 24s ease-in-out infinite; }
        .blob.b3 { width: 300px; height: 300px; background: var(--mint); top: 45%; right: 6%; animation: drift3 18s ease-in-out infinite; }
        @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(70px,90px) scale(1.15); } }
        @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-80px,-60px) scale(1.1); } }
        @keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,60px); } }

        header {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        header .branding a {
            font-family: 'Fraunces', serif;
            color: var(--ink);
            text-decoration: none;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .header-right { display: flex; align-items: center; gap: 0.75rem; }
        .user-info {
            color: var(--muted);
            font-size: 0.82rem;
            padding: 0.45rem 0.9rem;
            background: var(--glass-strong);
            border-radius: 20px;
        }
        #logoutBtn {
            background: var(--glass-strong);
            color: var(--ink);
            border: none;
            padding: 0.5rem 1.1rem;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.2s ease;
            box-shadow: none;
        }
        #logoutBtn:hover { background: rgba(255,255,255,0.16); transform: translateY(-1px); }

        .container { max-width: 620px; margin: 3rem auto; padding: 0 1.25rem; position: relative; z-index: 1; }
        .admin-panel {
            background: var(--glass);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.45);
            padding: 2.5rem;
        }
        h2 {
            font-family: 'Fraunces', serif;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin: 0 0 0.4rem;
            color: var(--ink);
        }
        .admin-panel p { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.92rem; }

        .upload-form { display: flex; flex-direction: column; gap: 1rem; }
        input, textarea {
            padding: 0.85rem 1rem;
            color: var(--ink);
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }
        input::placeholder, textarea::placeholder { color: var(--muted); }
        input:focus, textarea:focus {
            border-color: var(--accent-1);
            background: rgba(255,255,255,0.07);
            outline: none;
            box-shadow: 0 0 0 4px rgba(167,139,250,0.18);
        }
        textarea { resize: vertical; min-height: 90px; }
        input.ai-typing, textarea.ai-typing {
            border-color: rgba(167,139,250,0.6);
            background: rgba(167,139,250,0.06);
            box-shadow: 0 0 0 4px rgba(167,139,250,0.1);
        }

        button {
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #1a1425;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 6px 18px rgba(167,139,250,0.3);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(167,139,250,0.42); }
        button:disabled { background: rgba(255,255,255,0.06); color: var(--muted); box-shadow: none; cursor: not-allowed; transform: none; }

        .preview-container{
            margin: 0.25rem 0; 
            display: flex;
            justify-content: center;
            text-align: center;
        }
        #imagePreview {
            max-width: 100%;
            max-height: 280px;
            display: none;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            margin-bottom: 0.75rem;
        }

        .ai-btn {
            background: rgba(167,139,250,0.12);
            color: #c7b6ff;
            border: 1px solid rgba(167,139,250,0.35);
            box-shadow: none;
            font-size: 0.85rem;
            padding: 0.65rem;
            font-weight: 600;
        }
        .ai-btn:hover { background: rgba(167,139,250,0.22); transform: none; box-shadow: none; }
        .ai-btn:disabled { background: rgba(255,255,255,0.04); border-color: transparent; color: var(--muted); }
        .ai-btn.loading {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            background: rgba(167,139,250,0.14);
            border-color: rgba(167,139,250,0.5);
            color: #c7b6ff;
            animation: aiPulse 1.6s ease-in-out infinite;
        }
        .ai-spinner {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(167,139,250,0.25);
            border-top-color: var(--accent-1);
            animation: aiSpin 0.7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes aiSpin { to { transform: rotate(360deg); } }
        @keyframes aiPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(167,139,250,0.25); }
            50% { box-shadow: 0 0 0 6px rgba(167,139,250,0); }
        }

        .login-button { display: block; margin: 0.5rem auto 0; padding: 0.75rem 2.2rem; }

        .success-message, .error-message {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%) scale(0.9);
            padding: 1.25rem 2.5rem;
            border-radius: 18px;
            font-size: 1.05rem;
            font-weight: 600;
            text-align: center;
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: all 0.3s ease;
            backdrop-filter: blur(20px);
        }
        .success-message {
            background: rgba(24,20,34,0.9);
            color: var(--success);
            border: 1px solid rgba(52,211,153,0.35);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .success-message.show { display: block; opacity: 1; transform: translate(-50%,-50%) scale(1); }

        .error-message {
            position: static;
            transform: none;
            background: rgba(251,113,133,0.1);
            color: #ff9fae;
            border: 1px solid rgba(251,113,133,0.3);
            box-shadow: none;
            margin-bottom: 0.25rem;
        }
        .error-message.show { display: block; opacity: 1; }

        .progress-container {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border-radius: 20px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            width: 0%;
            height: 8px;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .back-link { text-align: center; margin: 2rem 0; }
        .back-link a {
            color: var(--muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.25s ease;
            margin-right: 1.25rem;
        }
        .back-link a:hover { color: #c7b6ff; }
    </style>
</head>
<body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <header>
        <div class="branding"><a href="/">Picpool</a></div>
        <div class="header-right">
            <div class="user-info" id="userInfo" style="display: none;">
                <span id="userEmail"></span>
            </div>
            <button id="logoutBtn" onclick="netlifyIdentity.logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- Login Section -->
        <div class="admin-panel" id="loginSection">
            <h2>Admin Area</h2>
            <p>Log in to upload and manage photos.</p>
            <button class="login-button" onclick="netlifyIdentity.open()">Log in</button>
        </div>

        <!-- Upload Section -->
        <div class="admin-panel" id="uploadSection" style="display: none;">
            <h2>Upload New Photo</h2>
            <p>Add an image, then let AI draft the title and description for you. ~ optional</p>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage">Photo uploaded successfully!</div>

            <form class="upload-form" id="uploadForm">
                <input type="file" id="photoUpload" accept="image/*" required>

                <div class="preview-container">
                    <img id="imagePreview" alt="Image Preview">
                </div>
                <button type="button" id="aiGenerateBtn" class="ai-btn" disabled>✨ Generate title &amp; description with AI</button>  
                <input type="text" id="photoTitle" placeholder="Photo Title" required maxlength="25">
                <textarea id="photoDescription" placeholder="Photo Description (optional)" rows="3" maxlength="200"></textarea>
                <input type="text" id="photoTags" placeholder="Tags (comma-separated, e.g., nature, sunset)" required>

                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <button type="submit" id="uploadButton">Upload Photo</button>
            </form>
        </div>

        <div class="back-link">
            <a href="index.html"><i class="fa-regular fa-square-caret-left"></i> Back to Gallery</a>
            <a href="dashboard.html" id="dashboardLink" style="display: none;"><i class="fa-solid fa-user"></i> My Dashboard</a>
        </div>
    </div>

<script>
    let currentUser = null;
    let previewBase64 = null;
    let previewMediaType = null;

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    async function typeText(el, text, targetMs) {
        el.value = '';
        if (!text) return;
        el.classList.add('ai-typing');
        el.focus();
        const delay = Math.max(8, Math.min(35, targetMs / text.length));
        for (const ch of text) {
            el.value += ch;
            await sleep(delay);
        }
        el.classList.remove('ai-typing');
    }

    netlifyIdentity.on('init', user => { if (user) handleUserLogin(user); });
    netlifyIdentity.on('login', user => handleUserLogin(user));
    netlifyIdentity.on('logout', () => {
        currentUser = null;
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('uploadSection').style.display = 'none';
        document.getElementById('userInfo').style.display = 'none';
        document.getElementById('dashboardLink').style.display = 'none';
    });

    function handleUserLogin(user) {
        currentUser = user;
        document.getElementById('userEmail').textContent = `Logged in as: ${user.email}`;
        document.getElementById('userInfo').style.display = 'block';
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('uploadSection').style.display = 'block';
        document.getElementById('dashboardLink').style.display = 'inline-block';
    }

    function typeText(el, text, speed = 3) {
        return new Promise(resolve => {
            el.value = '';
            el.focus();
            let i = 0;
            (function step() {
                if (i < text.length) {
                    el.value += text[i++];
                    setTimeout(step, speed);
                } else {
                    resolve();
                }
            })();
        });
    }

    document.getElementById('photoUpload').addEventListener('change', function(event) {
        const file = event.target.files[0];
        const aiBtn = document.getElementById('aiGenerateBtn');
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('imagePreview');
                preview.src = e.target.result;
                preview.style.display = 'block';
                previewBase64 = e.target.result.split(',')[1];
                previewMediaType = file.type;
                aiBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        } else {
            previewBase64 = null;
            previewMediaType = null;
            aiBtn.disabled = true;
        }
    });

    document.getElementById('aiGenerateBtn').addEventListener('click', async function() {
        if (!previewBase64) return;
        const btn = this;
        const originalLabel = btn.innerHTML;
        btn.disabled = true;
        btn.classList.add('loading');
        btn.innerHTML = '<span class="ai-spinner"></span>Thinking...';
        clearError();
        try {
            const res = await fetch('/.netlify/functions/generate-caption', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: previewBase64, mediaType: previewMediaType })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'AI generation failed');
            await typeText(document.getElementById('photoTitle'), data.title || '', 450);
            await typeText(document.getElementById('photoDescription'), data.description || '', 850);
        } catch (err) {
            showError('AI generation failed: ' + err.message);
        } finally {
            btn.disabled = false;
            btn.classList.remove('loading');
            btn.innerHTML = originalLabel;
        }
    });

    document.getElementById('uploadForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        if (!currentUser) {
            showError('User not authenticated');
            return;
        }

        const fileInput = document.getElementById('photoUpload');
        const file = fileInput.files[0];
        const title = document.getElementById('photoTitle').value.trim();
        const description = document.getElementById('photoDescription').value.trim();
        const tagsInput = document.getElementById('photoTags').value.trim();
        const tags = tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag);

        if (!file || !title || tags.length === 0) {
            showError('Please complete all required fields: image, title, and at least one tag');
            return;
        }

        const maxSize = 10 * 1024 * 1024;
        if (file.size > maxSize) {
            showError('File size must be less than 10MB');
            return;
        }

        const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
        if (!validTypes.includes(file.type)) {
            showError('File must be an image (JPG, PNG, WebP, or GIF)');
            return;
        }

        const uploadButton = document.getElementById('uploadButton');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const successMessage = document.getElementById('successMessage');

        progressContainer.style.display = 'block';
        uploadButton.disabled = true;
        uploadButton.textContent = 'Uploading...';
        clearError();

        try {
            const userEmail = currentUser.email;
            const userName = currentUser.user_metadata?.full_name || userEmail.split('@')[0];
            const userTag = userEmail.replace('@', '_').replace(/\./g, '_');

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'picload_unsigned');

            const publicId = `photo-gallery/${userTag}/${title.replace(/\s+/g, '-').toLowerCase()}-${Date.now()}`;
            formData.append('public_id', publicId);

            const allTags = [...tags, `user-${userTag}`, `owner-${userEmail}`];
            formData.append('tags', allTags.join(','));

            const ctxParts = [
                `alt=${encodeURIComponent(title)}`,
                `description=${encodeURIComponent(description || '')}`,
                `user_email=${encodeURIComponent(userEmail)}`,
                `user_id=${encodeURIComponent(currentUser.id || '')}`,
                `user_name=${encodeURIComponent(userName)}`
            ];
            formData.append('context', ctxParts.join('|'));

            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                if (progress <= 90) progressBar.style.width = progress + '%';
            }, 300);

            const response = await fetch('https://api.cloudinary.com/v1_1/dpemqdflm/image/upload', {
                method: 'POST',
                body: formData,
            });

            clearInterval(interval);

            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                throw new Error(error.error?.message || 'Upload failed');
            }

            progressBar.style.width = '100%';
            const result = await response.json();
            console.log('Upload successful:', result.public_id);

            successMessage.classList.add('show');
            setTimeout(() => successMessage.classList.remove('show'), 3000);

            document.getElementById('uploadForm').reset();
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('aiGenerateBtn').disabled = true;
            previewBase64 = null;
            previewMediaType = null;
            progressContainer.style.display = 'none';
            progressBar.style.width = '0%';
        } catch (error) {
            showError('Upload failed: ' + error.message);
            console.error('Upload error:', error);
        } finally {
            uploadButton.disabled = false;
            uploadButton.textContent = 'Upload Photo';
        }
    });

    function showError(message) {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = message;
        errorDiv.classList.add('show');
    }

    function clearError() {
        document.getElementById('errorMessage').classList.remove('show');
    }
</script>
</body>
</html>
